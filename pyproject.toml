[project]
name = "premiumhandpieceparts-scraper"
version = "0.1.0"
description = "Modular product data extraction framework for Premium Handpiece Parts"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.16,<2",
  "beautifulsoup4>=4.13,<5",
  "httpx>=0.28,<1",
  "loguru>=0.7,<1",
  "lxml>=6,<7",
  "orjson>=3.10,<4",
  "playwright>=1.55,<2",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "python-dotenv>=1.1,<2",
  "requests>=2.32,<3",
  "rich>=14,<15",
  "SQLAlchemy>=2.0,<3",
  "tenacity>=9,<10",
  "tqdm>=4.67,<5",
  "typer>=0.16,<1",
]

[project.optional-dependencies]
dev = [
  "black>=25,<26",
  "mypy>=1.17,<2",
  "pre-commit>=4.3,<5",
  "pytest>=8.4,<9",
  "pytest-cov>=6,<7",
  "ruff>=0.12,<1",
]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_return_any = true
warn_unused_configs = true
